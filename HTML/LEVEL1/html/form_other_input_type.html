<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action ="/contact-me"> 
       Date<input type = "date"><br>
       File: <input type = "file"><br>
       Color: <input type = "color"><br>
       Price range:<input type = "range"><br>
       Poke me: <input type = "button" value ="POKED"><br>
       Submit: <input type = "submit"><br><br>


       <label for = "male">Male:</label>
       <input type = "radio" id = "male" name = "gender" value ="male">
       <label for = "female">female:</label>
       <input type = "radio" id = "female" name = "gender" value ="female">
       <label for = "other">other:</label>
       <input type = "radio" id = "other" name = "gender" value ="other"><br>
       <br><br>

         
       <label for = "c">C</label>
        <input type = "checkbox" name = "lang" id = "c" value = "c"><br>
        <label for = "c++">C++</label>
         <input type = "checkbox" name = "lang" id = "c++" value = "c++"><br>
         <label for = "python">python</label>
          <input type = "checkbox" name = "lang" id = "python" value = "python"><br><br>


        <label for = "country">Select your country</label>
          <select name = "country" id = "country">
            <option values = "India">India</option>
            <option values = "U.k">u.k</option>
            <option values = "US">US</option><br><br>
          </select>


          <textarea name = "story" id= "story" cols= "20" rows="4">
            please write a story
          </textarea>
       
    </form>
